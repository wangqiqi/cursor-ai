name: Super Cursor Verify

on:
  push:
    branches: [master, main]
    paths:
      - '.cursor/**'
      - 'config/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - '.cursor/**'
      - 'config/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Template layout + scaffold + runner smoke
        run: bash .cursor/bin/template-verify.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: VitePress build
        run: npm ci && npm run docs:build
